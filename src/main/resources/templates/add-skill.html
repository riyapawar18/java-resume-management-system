<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Skill</title>

</head>

<body>

<h1>Add Skill</h1>

<form action="/admin/skills/save"
      method="post"
      th:object="${skill}">

    <label>Skill Name</label>

    <input type="text"
           th:field="*{name}"
           required>

    <br><br>

    <label>Category</label>

    <input type="text"
           th:field="*{category}"
           required>

    <br><br>

    <button type="submit">
        Save Skill
    </button>

</form>

<br>

<a href="/admin/skills">Back</a>

</body>

</html>
