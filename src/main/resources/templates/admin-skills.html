<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Skills</title>

</head>

<body>

<h1>Manage Skills</h1>

<a href="/admin">Dashboard</a>

<br><br>

<a href="/admin/skills/add">
    + Add Skill
</a>

<br><br>

<table border="1"
       cellpadding="12"
       cellspacing="0">

    <tr>

        <th>ID</th>
        <th>Skill</th>
        <th>Category</th>
        <th>Actions</th>

    </tr>

    <tr th:each="skill : ${skills}">

        <td th:text="${skill.id}"></td>

        <td th:text="${skill.name}"></td>

        <td th:text="${skill.category}"></td>

        <td>

            <a th:href="@{/admin/skills/edit/{id}(id=${skill.id})}">
                Edit
            </a>

            <a th:href="@{/admin/skills/delete/{id}(id=${skill.id})}"
               onclick="return confirm('Delete this skill?')">

                Delete

            </a>

        </td>

    </tr>

</table>

</body>

</html>
